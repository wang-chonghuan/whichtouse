<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Writing — which tool to use — WhichToUse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>html{scroll-behavior:smooth}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-background font-sans text-foreground">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

/* Rank, name, and three sentences — nothing else. Everything we know beyond
 * this (pricing, who it suits, sources, when we last checked) lives on the
 * detail page, because a list exists to decide what to open. */
const card = (it, i) => `
  <a href="product.html" class="group block border-b border-border/70 px-0.5 py-3.5 transition-[padding] hover:pl-2.5">
    <div class="flex gap-2.5">
      <span class="w-3 shrink-0 pt-0.5 text-[12px] tabular-nums text-muted-foreground">${i + 1}</span>
      <div class="min-w-0 flex-1">
        <div class="text-sm font-semibold">${it.owner ? it.owner + '/' : ''}${it.n}</div>
        <p class="mt-0.5 text-[13.5px] leading-normal text-muted-foreground">${it.desc}</p>
        <!-- §5 EXTENSION — the two semantic dots. Dark cool green for the edge,
             --destructive for the drawback. -->
        <p class="mt-1.5 flex items-start gap-2 text-[13.5px] leading-normal">
          <span class="mt-[7px] size-1.5 shrink-0 rounded-full bg-edge"></span><span>${it.edge}</span>
        </p>
        <p class="mt-1 flex items-start gap-2 text-[13.5px] leading-normal">
          <span class="mt-[7px] size-1.5 shrink-0 rounded-full bg-con"></span><span>${it.con}</span>
        </p>
      </div>
    </div>
  </a>`;

/* One standing: five by default, the rest revealed in place. */
const standing = (track, list) => {
  const all = TASK[track.key][list.key];
  const rest = all.slice(5, 10);
  const emerging = list.key === 'emerging';
  /* §3.2 — the plan-tag ramp reused for standing weight: settled = grey,
   * provisional = tinted brand. Contrast, not hue. */
  const count = emerging
    ? 'bg-accent text-accent-foreground'
    : 'bg-secondary text-muted-foreground';
  return `
  <section class="mt-7 first:mt-0">
    <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5 border-b border-border pb-2">
      <span class="text-[11px] font-bold uppercase tracking-label">${list.label}</span>
      <span class="rounded-full px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-micro ${count}">${all.length}</span>
      <span class="text-[12.5px] text-muted-foreground">${list.note}</span>
    </div>
    ${all.slice(0, 5).map((it, i) => card(it, i)).join('')}
    ${rest.length ? `
      <div data-more class="hidden">${rest.map((it, i) => card(it, i + 5)).join('')}</div>
      <button data-expand data-count="${rest.length}"
              class="w-full pt-3.5 text-center text-[12.5px] font-semibold text-muted-foreground transition-colors hover:text-foreground">
        See ${rest.length} more &rarr;
      </button>` : `
      <p class="pt-3.5 text-center text-[12.5px] text-muted-foreground">Only ${all.length} clear the bar here.</p>`}
  </section>`;
};

main.innerHTML = `
<div class="mx-auto mb-16 mt-7 flex max-w-container flex-col gap-7 px-4 sm:px-6 lg:px-8">

  <!-- §3.9 — breadcrumb row with a 36px circular back control -->
  <nav class="flex items-center gap-3 text-sm text-muted-foreground">
    <a href="home.html" aria-label="Back"
       class="flex size-9 shrink-0 items-center justify-center rounded-full border border-border bg-card transition-colors hover:border-foreground/20">
      <svg class="size-4 text-foreground" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m0 0 7 7m-7-7 7-7"/></svg>
    </a>
    <a href="home.html" class="transition-colors hover:text-foreground">Home</a>
    <span>&rsaquo;</span>
    <span>Tasks</span>
    <span>&rsaquo;</span>
    <span class="font-semibold text-foreground">${TASK.name}</span>
  </nav>

  <!-- §3.4 white panel: the whole standing lives on one surface -->
  <section class="rounded-3xl bg-card p-7">

    <h1 class="text-3xl font-bold leading-tight tracking-tight sm:text-[34px]">${TASK.name}</h1>
    <p class="mt-3 max-w-3xl text-[15.5px] leading-normal text-muted-foreground">${TASK.note}</p>
    <p class="mt-2 max-w-3xl text-[14.5px] leading-normal text-muted-foreground">
      Three forms, ranked separately — a hosted product, a repo you run, and a skill you drop into an
      agent are not the same decision. Each form has two standings: what has held the top, and what is
      coming for it.
    </p>

    <div class="mt-8 grid gap-x-9 gap-y-12 md:grid-cols-2 xl:grid-cols-3">
      ${TRACKS.map((track) => `
        <div class="min-w-0">
          <!-- §3.8 — the brand's one structural use: a 2px left bar on the heading -->
          <h2 class="mb-3.5 border-l-2 border-brand pl-3.5 text-xl font-bold tracking-tight md:text-[22px]">${track.label}</h2>
          ${LISTS.map((list) => standing(track, list)).join('')}
        </div>`).join('')}
    </div>

  </section>

  <!-- §3.4 tinted panel -->
  <section class="rounded-3xl border border-panel-tint-border bg-panel-tint p-5 sm:p-[26px]">
    <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
      <h2 class="text-2xl font-bold tracking-tight">Watchlist</h2>
      <span class="text-[14.5px] text-muted-foreground">pulled, or being re-checked</span>
    </div>
    <div class="mt-4 flex flex-wrap gap-2">
      ${TASK.watchlist.map((w) => `
        <a href="${w.url}" class="rounded-full border border-border bg-card px-3 py-1 text-[13.5px] font-medium text-foreground/70 transition-colors hover:border-foreground/20">${w.n}</a>`).join('')}
    </div>
    <p class="mt-5 text-[12.5px] text-muted-foreground">
      Five per standing by default, ten at most. Removing an entry is as much of the job as adding one.
    </p>
  </section>

</div>`;

/* Expand in place: the list grows, the rows do not change. */
document.querySelectorAll('[data-expand]').forEach((btn) => {
  const count = btn.dataset.count;
  btn.addEventListener('click', () => {
    const open = !btn.previousElementSibling.classList.toggle('hidden');
    btn.innerHTML = open ? 'Show top 5 only &uarr;' : `See ${count} more &rarr;`;
  });
});
</script>
</body>
</html>
