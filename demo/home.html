<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhichToUse — pick by the job, not by the tool</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>html{scroll-behavior:smooth}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-background font-sans text-foreground">
<script src="shared.js"></script>
<script>
const main = shell({ home: true });

/* One line each. A claim that needs a paragraph is not a claim. */
const POINTS = [
  ['Start from the job',       'Pick what you need done, not a tool name off an A-to-Z list.'],
  ['Three forms side by side', 'Hosted product, open-source repo and agent skill, ranked separately.'],
  ['Five, not five hundred',   'Each standing shows five by default, ten at most.'],
  ['Drawbacks up front',       'Every entry names the single biggest reason not to pick it.'],
  ['Emerging, tracked',        'A second standing for what is climbing but still unproven.'],
];

const COLUMNS = [
  ['Content Writing', ['ChatGPT', 'Claude', 'Jasper', 'Grammarly', 'Notion AI']],
  ['Coding',          ['Claude Code', 'Codex', 'Cursor', 'GitHub Copilot', 'Windsurf']],
  ['Image Generation',['Midjourney', 'Stable Diffusion', 'Flux', 'Ideogram', 'Canva']],
  ['Research & Search',['Perplexity', 'NotebookLM', 'Elicit', 'Consensus', 'Exa']],
];

const TRENDING = [
  ['block/buzz', 'A hive mind communication platform', '11,829', '+2,506'],
  ['alibaba/open-code-review', 'Deterministic review pipelines plus an LLM agent', '12,917', '+439'],
  ['citrolabs/ego-lite', 'A browser for AI agents that reuses your logged-in session', '3,529', '+986'],
  ['ComposioHQ/awesome-claude-skills', 'A curated list of Claude Skills, resources and tools', '70,554', '+574'],
  ['anthropics/claude-cookbooks', 'Official recipes for building with Claude', '42,860', '+366'],
  ['menloresearch/jan', 'A fully offline desktop assistant', '39,204', '+284'],
];

const STATS = [
  ['25', 'tasks covered'], ['3', 'forms per task'],
  ['5', 'shown by default'], ['Weekly', 're-checked'],
];

const CHEVRON = '<svg class="size-4 shrink-0 text-muted-foreground" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';

/* §3.5 — the list row: 45px, 1px bottom rule, and the padding-left nudge on
 * hover that is this system's one signature micro-interaction. */
const row = (rank, name, href) => `
  <a href="${href}" class="group flex items-center gap-2.5 border-b border-border/70 px-0.5 py-2.5 text-sm transition-[padding] hover:pl-2.5">
    <span class="w-3 shrink-0 text-[12px] tabular-nums text-muted-foreground">${rank}</span>
    ${tile(name)}
    <span class="min-w-0 flex-1 truncate">${name}</span>
    ${CHEVRON}
  </a>`;

main.innerHTML = `

<!-- §1.1/§2.4 — the hero is a white section on the off-white canvas. No shadow,
     one bottom border; that is the whole elevation story. -->
<section class="border-b border-border bg-card px-6 pb-7 pt-8">
  <div class="mx-auto max-w-3xl text-center">

    <span class="mb-3.5 inline-flex items-center gap-2 rounded-full border border-border bg-secondary py-1 pl-1.5 pr-3 text-xs font-semibold">
      <span class="rounded-full bg-primary px-2 py-0.5 text-brand">HANDS-ON</span>
      every tool opened, documented, tried
    </span>

    <h1 class="text-balance text-[clamp(28px,4.6vw,42px)] font-bold leading-[1.08] tracking-tight">
      Pick by <span class="inline-block -rotate-2 rounded-[9px] bg-brand px-2 text-brand-foreground">the job</span>,<br class="hidden sm:block">
      not by the tool.
    </h1>

    <p class="mx-auto mt-3 max-w-xl text-[15.5px] leading-normal text-muted-foreground">
      Short lists, three forms compared side by side, and the drawback written where you cannot miss it.
    </p>

    <!-- §3.1 — hero CTA: min-h-11, radius 10, 13.5px/600 -->
    <button id="heroToggle"
            class="mx-auto mt-[18px] flex min-h-11 items-center justify-center gap-2 rounded-md bg-primary px-5 text-[13.5px] font-semibold text-primary-foreground transition-colors hover:bg-primary/88">
      <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      <span id="heroToggleText">Hide the 25 tasks</span>
    </button>

    <div class="mt-[18px] flex flex-wrap items-baseline justify-center gap-x-6 gap-y-2">
      ${STATS.map(([n, l]) => `
        <span class="text-[15px] font-bold">${n}
          <span class="text-[13.5px] font-normal text-muted-foreground">${l}</span>
        </span>`).join('')}
    </div>

  </div>
</section>

<!-- §2.1/§2.2 — container, and sections stacked in a 28px flex column -->
<div class="mx-auto mb-16 mt-7 flex max-w-container flex-col gap-7 px-4 sm:px-6 lg:px-8">

  <!-- §3.4 white panel -->
  <section class="rounded-3xl bg-card p-7">
    <div class="flex flex-wrap items-baseline justify-between gap-3">
      <div>
        <h2 class="text-2xl font-bold tracking-tight">Find your tool by the job</h2>
        <p class="mt-1 text-[14.5px] text-muted-foreground">Top-ranked picks in the tasks people search most</p>
      </div>
      <a href="category.html" class="text-[12.5px] font-semibold text-muted-foreground transition-colors hover:text-foreground">All 25 tasks &rarr;</a>
    </div>

    <div class="mt-6 grid gap-9 sm:grid-cols-2 xl:grid-cols-4">
      ${COLUMNS.map(([title, names]) => `
        <div class="flex flex-col">
          <h3 class="border-b-2 border-foreground pb-2 text-center text-base font-semibold">${title}</h3>
          <div class="mt-1">${names.map((n, i) => row(i + 1, n, 'product.html')).join('')}</div>
          <a href="category.html" class="mt-auto pt-3.5 text-center text-[12.5px] font-semibold text-muted-foreground transition-colors hover:text-foreground">See more &rarr;</a>
        </div>`).join('')}
    </div>
  </section>

  <!-- §3.4 tinted panel + §3.5 wide row -->
  <section class="rounded-3xl border border-panel-tint-border bg-panel-tint p-5 sm:p-[26px]">
    <div class="flex flex-wrap items-baseline justify-between gap-3 px-1">
      <div>
        <h2 class="text-2xl font-bold tracking-tight">Trending today</h2>
        <p class="mt-1 text-[14.5px] text-muted-foreground">Fast-growing open-source AI projects, refreshed every morning</p>
      </div>
      <span class="text-[12.5px] font-semibold text-muted-foreground">${TRENDING.length} repositories</span>
    </div>

    <div class="mt-5">
      ${TRENDING.map(([n, d, stars, today], i) => `
        <a href="product.html" class="grid cursor-pointer grid-cols-[36px_1fr_72px] items-center gap-4 border-t border-foreground/10 px-1 py-4 transition-[padding] hover:pl-4 sm:grid-cols-[56px_1fr_72px] sm:gap-5">
          <span class="flex items-center gap-2.5">
            <span class="w-3 text-[12px] tabular-nums text-muted-foreground">${i + 1}</span>
            <span class="hidden sm:block">${tile(n)}</span>
          </span>
          <span class="min-w-0">
            <span class="block truncate text-sm font-semibold">${n}</span>
            <span class="mt-0.5 block truncate text-[13.5px] text-muted-foreground">${d}</span>
          </span>
          <span class="text-right">
            <span class="block text-sm font-semibold tabular-nums">${stars}</span>
            <span class="mt-0.5 block text-[12.5px] font-semibold tabular-nums text-muted-foreground">${today}</span>
          </span>
        </a>`).join('')}
    </div>
  </section>

  <!-- §3.4 brand panel — the one place the brand colour covers real area -->
  <section class="rounded-3xl bg-brand p-7 text-brand-foreground sm:p-10">
    <h2 class="text-2xl font-bold tracking-tight">What makes this different</h2>
    <p class="mt-1 max-w-xl text-[14.5px] text-brand-foreground/70">
      Five rules we hold to. Each one costs us coverage, which is the point.
    </p>
    <div class="mt-7 grid gap-x-8 gap-y-6 sm:grid-cols-2 lg:grid-cols-5">
      ${POINTS.map(([t, b], i) => `
        <div>
          <div class="text-2xl font-bold tabular-nums leading-none text-brand-foreground/25">${i + 1}</div>
          <div class="mt-2 text-[15px] font-bold">${t}</div>
          <p class="mt-1 text-[13.5px] leading-normal text-brand-foreground/75">${b}</p>
        </div>`).join('')}
    </div>
    <p class="mt-8 text-[12.5px] font-semibold text-brand-foreground/60">We take no payment for placement.</p>
  </section>

</div>`;

/* The hero CTA and the header nav item drive the same sidebar. */
const aside = document.getElementById('use-case-sidebar');
const hero = document.getElementById('heroToggle');
const heroText = document.getElementById('heroToggleText');
const sync = () => {
  heroText.textContent = aside.classList.contains('lg:hidden')
    ? 'Browse all 25 tasks' : 'Hide the 25 tasks';
};
hero.addEventListener('click', () => { aside.classList.toggle('lg:hidden'); sync(); });
document.getElementById('sidebarToggle').addEventListener('click', sync);
</script>
</body>
</html>
