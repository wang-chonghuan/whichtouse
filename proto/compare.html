<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grammarly vs ChatGPT — which should you use? — WhichToUse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

const A = { n:'Grammarly', s:7.0, mono:'#2f9e6b', free:'Grammar, spelling, basic tone', paid:'$12/mo', v:'Jul 23',
  when:'You can already produce a draft and want it clean.',
  pros:['Works inside almost every writing surface', 'Free tier fixes the basics'],
  cons:['Flattens a deliberate voice', 'Edits only — never writes'] };

const B = { n:'ChatGPT', s:9.4, mono:'#3b6fb0', free:'Full chat access, current model', paid:'$20/mo', v:'Jul 23',
  when:'You are starting from nothing and need volume.',
  pros:['Strongest first-draft generation', 'One tool covers most writing jobs'],
  cons:['Loses the thread on long pieces', 'Tone needs repeated correction'] };

const col = (x, winner) => `
  <div class="flex-1 rounded-2xl border ${winner ? 'border-blue-200 bg-gradient-to-b from-blue-50/60 to-transparent' : 'border-neutral-200'} p-5">
    <div class="flex items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl text-[17px] font-bold text-white" style="background:${x.mono}">${x.n[0]}</span>
      <div class="min-w-0 flex-1">
        <div class="text-[17px] font-bold">${x.n}</div>
        <div class="text-[12px] text-neutral-400">Content Writing</div>
      </div>
      <div class="text-[26px] font-extrabold tabular-nums">${x.s.toFixed(1)}</div>
    </div>

    <div class="mt-4 rounded-xl bg-white/70 p-3.5 ring-1 ring-neutral-200/70">
      <div class="text-[11px] font-bold uppercase tracking-[0.08em] text-neutral-500">Choose it when</div>
      <div class="mt-1 text-[13.5px] leading-snug">${x.when}</div>
    </div>

    <div class="mt-4 text-[11px] font-bold uppercase tracking-[0.08em] text-neutral-500">Pricing
      <span class="ml-1 font-medium normal-case tracking-normal text-neutral-400">· verified ${x.v}</span>
    </div>
    <div class="mt-1.5 text-[13.5px]"><span class="text-neutral-400">Free —</span> ${x.free}</div>
    <div class="text-[13.5px]"><span class="text-neutral-400">Paid —</span> <b>${x.paid}</b></div>

    <div class="mt-4 text-[11px] font-bold uppercase tracking-[0.08em] text-neutral-500">Strengths</div>
    <ul class="mt-1.5 space-y-1 text-[13px]">
      ${x.pros.map((p) => `<li class="flex gap-2"><span class="text-emerald-600">✓</span>${p}</li>`).join('')}
    </ul>

    <div class="mt-3.5 text-[11px] font-bold uppercase tracking-[0.08em] text-rose-700">Drawbacks</div>
    <ul class="mt-1.5 space-y-1 text-[13px]">
      ${x.cons.map((p) => `<li class="flex gap-2"><span class="text-rose-500">—</span>${p}</li>`).join('')}
    </ul>
  </div>`;

main.innerHTML = `
<div class="mx-auto max-w-[920px] px-6 py-8">

  <nav class="text-[12.5px] text-neutral-400">
    <a href="home.html" class="hover:text-blue-600">Home</a><span class="px-1">›</span>
    <a href="category.html" class="hover:text-blue-600">Content Writing</a><span class="px-1">›</span>Grammarly vs ChatGPT
  </nav>

  <h1 class="mt-3 text-[32px] font-extrabold leading-[1.1] tracking-tight">Grammarly vs ChatGPT</h1>

  <div class="mt-4 rounded-2xl border border-neutral-200 bg-neutral-50/70 p-5">
    <div class="text-[11px] font-bold uppercase tracking-[0.09em] text-neutral-500">Short answer</div>
    <p class="mt-2 text-[15.5px] leading-[1.55]">
      <b>They are not substitutes.</b> ChatGPT gets the words onto the page; Grammarly cleans up
      words that already exist. If you can write a draft yourself and only want it tightened,
      Grammarly is the cheaper and better-aimed tool. If the blank page is the problem, Grammarly
      will not solve it at any price.
    </p>
  </div>

  <div class="mt-6 flex flex-col gap-4 sm:flex-row">
    ${col(A, false)}${col(B, true)}
  </div>

  <section class="mt-10">
    <h2 class="text-[17px] font-bold tracking-tight">Side by side</h2>
    <div class="mt-3 overflow-x-auto rounded-2xl border border-neutral-200">
      <table class="w-full min-w-[560px] text-sm">
        <thead class="bg-neutral-50/80 text-left text-[11px] font-bold uppercase tracking-wide text-neutral-500">
          <tr><th class="px-5 py-3 w-[190px]"></th><th class="px-5 py-3">Grammarly</th><th class="px-5 py-3">ChatGPT</th></tr>
        </thead>
        <tbody>
          ${[
            ['First-draft generation', 'Not its job', 'Strong'],
            ['Grammar and clarity', 'Strong', 'Adequate, needs prompting'],
            ['Keeping your voice', 'Weak — flattens it', 'Moderate'],
            ['Long documents', 'Fine', 'Drifts after a few thousand words'],
            ['Free tier', 'Genuinely usable', 'Genuinely usable'],
            ['Entry paid', '$12/mo', '$20/mo'],
          ].map(([k, a, b], i) => `
            <tr class="${i ? 'border-t border-neutral-100' : ''}">
              <td class="px-5 py-3 text-[12.5px] font-semibold text-neutral-500">${k}</td>
              <td class="px-5 py-3">${a}</td>
              <td class="px-5 py-3">${b}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </section>

  <section class="mt-9">
    <h2 class="text-[17px] font-bold tracking-tight">Other comparisons</h2>
    <div class="mt-3 flex flex-wrap gap-2">
      ${['ChatGPT vs Claude', 'Claude vs Jasper', 'Grammarly vs Jasper', 'ChatGPT vs Writesonic'].map((n) => `
        <a href="compare.html" class="rounded-full border border-neutral-200 px-3.5 py-1.5 text-[13px] font-semibold transition hover:border-blue-400 hover:text-blue-700">${n}</a>`).join('')}
    </div>
  </section>

  <div class="h-20"></div>
</div>`;
</script>
</body>
</html>
