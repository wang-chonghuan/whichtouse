<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhichToUse — Hands-on AI tool reviews and rankings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ home: true });

const picks = [
  ['Automattic/harper', 'Content Writing', 'Offline, Rust-powered grammar checking. A real answer when privacy rules out Grammarly — but it only checks, it does not write.'],
  ['citrolabs/ego-lite', 'Browser Automation', 'A browser for agents that reuses your logged-in session. The zero-config claim holds; stability under long runs is still unproven.'],
  ['shiyu-coder/Kronos', 'Data Analysis', 'A foundation model for financial time series. Do not let the framing fool you — this is a model, not a product you can use today.'],
];

const duel = [
  ['Coding', 'Claude Code', 'Superpowers', 'coding'],
  ['Content Writing', 'ChatGPT', 'Anthropic Document Skills', 'content-writing'],
  ['Image Generation', 'Midjourney', 'FLUX.2', 'image-generation'],
  ['Browser Automation', 'Playwright', 'ego-lite', 'browser-automation'],
  ['Research & Search', 'Perplexity', 'World Monitor', 'research-search'],
];

main.innerHTML = `
<div class="mx-auto max-w-[1140px] px-6 py-10">

  <section class="max-w-[760px]">
    <span class="text-[11.5px] font-bold uppercase tracking-[0.14em] text-blue-600">Hands-on AI tool reviews</span>
    <h1 class="mt-3.5 text-[42px] font-extrabold leading-[1.06] tracking-[-0.025em]">
      We actually open the tools<br class="hidden sm:block"> before we rank them.
    </h1>
    <p class="mt-5 text-[16.5px] leading-[1.6] text-neutral-600">
      For every pick we visit the product, read the documentation, and try it wherever we can —
      then write down what it is genuinely good at and where it falls short.
      No scraped listicles. No affiliate order.
    </p>
    <div class="mt-6 flex flex-wrap items-center gap-x-5 gap-y-2 text-[13px] text-neutral-500">
      <span><b class="text-[#171a21]">25</b> use cases</span>
      <span class="text-neutral-300">·</span>
      <span>apps <b class="text-[#171a21]">+</b> open-source skills</span>
      <span class="text-neutral-300">·</span>
      <span>every claim traceable to a source</span>
    </div>
  </section>

  <!-- curated, not a feed -->
  <section class="mt-14">
    <div class="flex items-end justify-between gap-4">
      <div>
        <h2 class="text-[21px] font-bold tracking-tight">Worth a look this week</h2>
        <p class="mt-1.5 text-[13.5px] text-neutral-500">Three we opened. One line each on whether it deserves your time.</p>
      </div>
      <span class="hidden whitespace-nowrap text-[12.5px] text-neutral-400 sm:block">Updated Jul 25</span>
    </div>
    <div class="mt-5 grid gap-4 md:grid-cols-3">
      ${picks.map(([n, c, verdict]) => `
        <a href="product.html" class="group flex flex-col rounded-2xl border border-neutral-200 p-5 transition hover:-translate-y-0.5 hover:border-blue-300 hover:shadow-[0_8px_24px_-12px_rgba(37,99,235,0.35)]">
          <span class="text-[11px] font-bold uppercase tracking-[0.08em] text-blue-600">${c}</span>
          <span class="mt-2 text-[15.5px] font-semibold group-hover:text-blue-700">${n}</span>
          <span class="mt-2.5 text-[13.5px] leading-[1.55] text-neutral-600">${verdict}</span>
        </a>`).join('')}
    </div>
  </section>

  <!-- safe vs rising, across categories -->
  <section class="mt-14">
    <h2 class="text-[21px] font-bold tracking-tight">The safe pick and the rising one</h2>
    <p class="mt-1.5 max-w-[620px] text-[13.5px] text-neutral-500">
      Two answers to the same question: what you choose when you cannot afford a mistake,
      and what you choose when you want the upside.
    </p>
    <div class="mt-5 overflow-hidden rounded-2xl border border-neutral-200">
      <table class="w-full text-sm">
        <thead class="bg-neutral-50/80 text-left text-[11px] font-bold uppercase tracking-wide text-neutral-500">
          <tr>
            <th class="px-5 py-3">Use case</th>
            <th class="px-5 py-3">Safe pick</th>
            <th class="px-5 py-3">Rising</th>
          </tr>
        </thead>
        <tbody>
          ${duel.map(([c, safe, rising], i) => `
            <tr class="${i ? 'border-t border-neutral-100' : ''} transition hover:bg-neutral-50/70">
              <td class="px-5 py-3.5">
                <a href="category.html" class="font-semibold text-blue-700 hover:underline">${c}</a>
              </td>
              <td class="px-5 py-3.5 text-neutral-700">${safe}</td>
              <td class="px-5 py-3.5">
                <span class="text-neutral-700">${rising}</span>
                <span class="ml-2 rounded-full bg-blue-50 px-1.5 py-px text-[10.5px] font-semibold text-blue-700">rising</span>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <a href="category.html" class="mt-4 inline-flex items-center gap-1.5 text-[13.5px] font-semibold text-blue-700 hover:gap-2.5 transition-all">
      Browse all 25 use cases <span>→</span>
    </a>
  </section>

  <footer class="mt-16 border-t border-neutral-200 pt-6 text-[12.5px] leading-relaxed text-neutral-400">
    We rank from a consensus of independent public sources, then check each pick ourselves.
    Pricing is re-verified by hand and dated on every product page.
  </footer>

  <div class="h-16"></div>
</div>`;
</script>
</body>
</html>
