<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhichToUse — pick by the job, not by the tool</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

/* Compact preview row: name, form is implied by the column, one-line verdict. */
const previewRow = (it, i) => `
  <a href="category.html" class="group flex items-start gap-2.5 border-b border-neutral-100 py-2.5 last:border-0">
    <span class="w-4 pt-[3px] text-center text-[12px] tabular-nums text-neutral-400">${i + 1}</span>
    <span class="min-w-0 flex-1">
      <span class="block truncate text-[13.5px] font-semibold group-hover:text-blue-700">${it.n}</span>
      <span class="mt-0.5 block text-[12px] leading-[1.4] text-neutral-500">${it.verdict}</span>
    </span>
  </a>`;

const previewCol = (track) => `
  <section class="min-w-0">
    <div class="mb-1 flex items-center gap-2 border-b-2 border-neutral-200 pb-1.5">
      <span class="h-1.5 w-1.5 rounded-full" style="background:${track.dot}"></span>
      <span class="text-[11px] font-bold tracking-[0.05em]">${track.label.toUpperCase()}</span>
      <span class="ml-auto text-[10.5px] font-semibold text-neutral-400">TOP 5</span>
    </div>
    ${TASK[track.key].map(previewRow).join('')}
  </section>`;

main.innerHTML = `
<div class="mx-auto max-w-[1180px] px-6 py-6">

  <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
    <h1 class="text-[24px] font-extrabold tracking-tight">${TASK.name}</h1>
    <span class="text-[12.5px] text-neutral-400">default task · pick another on the left</span>
  </div>
  <p class="mt-2 max-w-[720px] text-[13.5px] leading-relaxed text-neutral-600">${TASK.note}</p>

  <div class="mt-6 grid gap-x-8 gap-y-7 md:grid-cols-2 xl:grid-cols-3">
    ${TRACKS.map(previewCol).join('')}
  </div>

  <a href="category.html" class="mt-6 inline-flex items-center gap-1.5 rounded-full border border-neutral-200 px-4 py-2 text-[13px] font-semibold transition hover:border-blue-400 hover:text-blue-700">
    Open full ${TASK.name} ranking <span>→</span>
  </a>

  <!-- discovery, kept deliberately small -->
  <section class="mt-10 rounded-2xl border border-neutral-200 bg-neutral-50/50 p-5">
    <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
      <h2 class="text-[15px] font-bold tracking-tight">Emerging radar</h2>
      <span class="text-[12px] text-neutral-500">found, not yet judged — verification comes after</span>
    </div>
    <div class="mt-3 grid gap-2 sm:grid-cols-2">
      ${TASK.radar.map((r) => `
        <div class="flex items-start gap-2.5 rounded-lg bg-white px-3.5 py-2.5 ring-1 ring-neutral-200">
          <span class="min-w-0 flex-1">
            <span class="flex flex-wrap items-center gap-2">
              <a href="#" class="truncate text-[13px] font-semibold hover:text-blue-700">${r.n}</a>
              <span class="rounded-full px-1.5 py-px text-[10px] font-semibold ring-1 ${STATUS[r.status][1]}">${STATUS[r.status][0]}</span>
            </span>
            <span class="mt-0.5 block text-[12px] text-neutral-500">${r.note}</span>
          </span>
          <span class="whitespace-nowrap pt-0.5 text-[11px] text-neutral-400">${r.src}</span>
        </div>`).join('')}
    </div>
  </section>

  <div class="h-14"></div>
</div>`;
</script>
</body>
</html>
