<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhichToUse — pick by the job, not by the tool</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ home: true });

/* One line each. A claim that needs a paragraph is not a claim, it is an
 * explanation, and it belongs on the page that proves it. */
const POINTS = [
  ['Start from the job',       'Pick what you need done, not a tool name off an A-to-Z list.'],
  ['Three forms side by side', 'Hosted product, open-source repo and agent skill, ranked separately.'],
  ['Five, not five hundred',   'Each standing shows five by default, ten at most.'],
  ['Drawbacks up front',       'Every entry names the single biggest reason not to pick it.'],
  ['Emerging, tracked',        'A second standing for what is climbing but still unproven.'],
];

const TRENDING = [
  ['block/buzz', 'A hive mind communication platform', '11,829', '+2,506', 'Workflow Automation'],
  ['alibaba/open-code-review', 'Deterministic review pipelines plus an LLM agent', '12,917', '+439', 'Diagrams & Architecture'],
  ['citrolabs/ego-lite', 'A browser for AI agents that reuses your logged-in session', '3,529', '+986', 'Browser Automation'],
  ['ComposioHQ/awesome-claude-skills', 'A curated list of Claude Skills, resources and tools', '70,554', '+574', 'Workflow Automation'],
  ['anthropics/claude-cookbooks', 'Official recipes for building with Claude', '42,860', '+366', 'Coding'],
  ['menloresearch/jan', 'A fully offline desktop assistant', '39,204', '+284', 'Content Writing'],
];

/* Lifted from the live site so the two match exactly: filled blue while the
 * sidebar is hidden and the button is an invitation, outlined and quiet once
 * the sidebar is showing and the job is done. */
const PANEL_OPEN  = '<rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="m14 9 3 3-3 3"></path>';
const PANEL_CLOSE = '<rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="m16 15-3-3 3-3"></path>';
const CTA_BASE   = 'inline-flex items-center gap-2 h-[52px] px-6 rounded-full text-[16px] font-bold transition';
const CTA_CLOSED = 'bg-blue-600 text-white shadow-[0_6px_20px_-6px_rgba(37,99,235,0.5)] hover:bg-blue-700';
const CTA_OPEN   = 'bg-white text-[#6b7280] border border-[#e6e8ec] hover:bg-neutral-50';

main.innerHTML = `
<div class="mx-auto max-w-[1220px] px-6 py-8">
 <article class="rounded-2xl border border-neutral-200 bg-white px-8 py-8">

  <span class="text-[12px] font-bold uppercase tracking-[0.14em] text-blue-600">Hands-on AI tool reviews</span>

  <h1 class="mt-3 text-[38px] font-extrabold leading-[1.08] tracking-[-0.025em]">
    Pick by the job,<br class="hidden sm:block"> not by the tool.
  </h1>

  <p class="mt-4 max-w-[720px] text-[16px] leading-[1.55] text-neutral-600">
    Short lists, three forms compared side by side, and the drawback written where you cannot miss it.
  </p>

  <button id="sidebarToggle" type="button" aria-expanded="true" aria-controls="use-case-sidebar"
          class="mt-5 ${CTA_BASE} ${CTA_OPEN}">
    <svg id="sidebarToggleIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${PANEL_CLOSE}</svg>
    <span id="sidebarToggleText">Hide categories</span>
  </button>

  <p class="mt-3 text-[13px] font-medium text-neutral-500">
    25 use cases · apps + open-source skills · every claim traceable to a source
  </p>

  <div class="mt-9 grid gap-x-9 gap-y-10 lg:grid-cols-[1.55fr_1fr]">

    <section class="min-w-0">
      <div class="flex items-baseline justify-between gap-4">
        <h2 class="text-[19px] font-bold tracking-tight">Trending today</h2>
        <span class="text-[12px] text-neutral-400">${TRENDING.length} repositories</span>
      </div>
      <p class="mt-1.5 text-[13px] text-neutral-500">
        A live snapshot of fast-growing open-source AI projects. Pick any repo for an instant breakdown.
      </p>
      <div class="mt-4">
        ${TRENDING.map(([n, d, stars, today, cat]) => `
          <a href="product.html" class="group flex items-start gap-4 border-b border-neutral-100 py-3 last:border-0">
            <span class="min-w-0 flex-1">
              <span class="block truncate text-[14px] font-semibold group-hover:text-blue-700">${n}</span>
              <span class="mt-0.5 block text-[12.5px] leading-snug text-neutral-500">${d}</span>
            </span>
            <span class="flex flex-shrink-0 items-baseline gap-3 pt-0.5">
              <span class="text-[13px] font-semibold tabular-nums">${stars}</span>
              <span class="w-[52px] text-right text-[13px] font-semibold tabular-nums text-emerald-600">${today}</span>
            </span>
            <span class="hidden flex-shrink-0 rounded-full bg-blue-50 px-2.5 py-0.5 text-[11px] font-semibold text-blue-700 xl:block">${cat}</span>
          </a>`).join('')}
      </div>
    </section>

    <section class="min-w-0 lg:border-l lg:border-neutral-200 lg:pl-9">
      <h2 class="text-[19px] font-bold tracking-tight">What makes this different</h2>
      <div class="mt-4">
        ${POINTS.map(([t, b], i) => `
          <div class="flex gap-3.5 border-b border-neutral-100 py-3.5 last:border-0">
            <span class="w-4 flex-shrink-0 pt-px text-[15px] font-extrabold tabular-nums leading-tight text-neutral-200">${i + 1}</span>
            <div class="min-w-0">
              <div class="text-[14px] font-bold">${t}</div>
              <p class="mt-0.5 text-[12.5px] leading-snug text-neutral-500">${b}</p>
            </div>
          </div>`).join('')}
      </div>
      <p class="mt-4 text-[11.5px] leading-relaxed text-neutral-400">We take no payment for placement.</p>
    </section>

  </div>
 </article>
 <div class="h-14"></div>
</div>`;

/* Same behaviour as the live site: the button drives the sidebar and swaps both
   its label and its own emphasis. */
const aside  = document.getElementById('use-case-sidebar');
const toggle = document.getElementById('sidebarToggle');
const icon   = document.getElementById('sidebarToggleIcon');
const text   = document.getElementById('sidebarToggleText');

toggle.addEventListener('click', () => {
  const open = !aside.classList.toggle('lg:hidden');
  toggle.setAttribute('aria-expanded', String(open));
  icon.innerHTML = open ? PANEL_CLOSE : PANEL_OPEN;
  text.textContent = open ? 'Hide categories' : 'Browse all 25 use cases';
  toggle.className = `mt-5 ${CTA_BASE} ${open ? CTA_OPEN : CTA_CLOSED}`;
});
</script>
</body>
</html>
