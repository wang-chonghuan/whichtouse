<!doctype html>
<html lang="zh">
<head>

<title>PROTO · 首页</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ page: 'Home' });

main.innerHTML = `
<div class="mx-auto max-w-[1120px] px-6 py-7">

  <section class="max-w-[720px]">
    <span class="text-xs font-bold uppercase tracking-widest text-blue-600">Hands-on AI tool reviews</span>
    <h1 class="mt-3 text-[38px] font-extrabold leading-[1.1] tracking-tight">
      We actually open the tools before we rank them.
    </h1>
    <p class="mt-4 text-base leading-relaxed text-neutral-500">
      For every pick we visit the product, read the documentation, and try it wherever we can —
      then write down what it's genuinely good at and where it falls short. No scraped listicles.
      No affiliate order.
    </p>
    <p class="mt-3 text-[13px] font-medium text-neutral-500">
      25 use cases · apps + open-source skills · every claim traceable to a source
    </p>
  </section>

  <!-- ③ 有什么新东西：筛过的，不是裸列表 -->
  <section class="mt-10">
    <div class="flex items-baseline justify-between">
      <h2 class="text-xl font-bold">本周值得一看 ${src('soft','雷达 → 你筛过')}</h2>
