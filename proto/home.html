<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhichToUse — pick by the job, not by the tool</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ home: true });

/* Five claims, in the order someone meets them: how you arrive, what you get
 * shown, how much of it, how honest it is, and what happens next. */
const POINTS = [
  {
    t: 'Start from the job, not the tool.',
    b: 'You arrive with something to do — draft a post, automate a browser, build a deck. Pick the job and the ranking is already scoped. There is no A-to-Z directory to wander through, because a directory answers a question nobody asked.',
  },
  {
    t: 'Three forms, ranked side by side.',
    b: 'For every job we rank a hosted product, an open-source repo you run, and a skill you drop into an agent — separately. They are not the same decision: the budget, the control and the setup cost all differ, so the comparison should differ too.',
  },
  {
    t: 'Five, not five hundred.',
    b: 'Each standing shows five by default and ten at most. A list you can finish reading is worth more than a list that contains everything, and deciding what to remove is as much of the work as deciding what to add.',
  },
  {
    t: 'The drawback is in the first two lines.',
    b: 'Every entry states the one thing it does best and the single biggest reason not to pick it, at the same weight. Hidden costs — the seat minimum, the self-hosting bill, the missing interface — belong up front, not in a footnote you find after you have committed.',
  },
  {
    t: 'Emerging, tracked continuously.',
    b: 'Beside what has held the top for a year sits a second standing for what is climbing and unproven. We watch where new tools actually surface — repositories, launch boards, registries — and nothing appears until we have opened it ourselves.',
  },
];

main.innerHTML = `
<div class="mx-auto max-w-[880px] px-6 py-10">
 <article class="rounded-2xl border border-neutral-200 bg-white px-8 py-10 sm:px-12 sm:py-12">

  <h1 class="text-[40px] font-extrabold leading-[1.08] tracking-[-0.025em] sm:text-[46px]">
    Pick by the job,<br class="hidden sm:block"> not by the tool.
  </h1>

  <p class="mt-6 max-w-[620px] text-[16.5px] leading-[1.6] text-neutral-600">
    Short lists, three forms compared side by side, and the drawback written where you cannot miss it.
  </p>

  <a href="category.html"
     class="mt-8 inline-flex items-center gap-2 rounded-full bg-blue-600 px-6 py-3 text-[14px] font-semibold text-white transition hover:bg-blue-700">
    Browse the tasks <span>→</span>
  </a>

  <div class="mt-12 border-t border-neutral-100 pt-2">
    ${POINTS.map((p, i) => `
      <section class="flex gap-5 border-b border-neutral-100 py-7 last:border-0 sm:gap-7">
        <span class="w-7 flex-shrink-0 pt-0.5 text-[26px] font-extrabold leading-none tabular-nums text-neutral-200">${i + 1}</span>
        <div class="min-w-0">
          <h2 class="text-[18px] font-bold tracking-tight">${p.t}</h2>
          <p class="mt-2 max-w-[640px] text-[14.5px] leading-[1.65] text-neutral-600">${p.b}</p>
        </div>
      </section>`).join('')}
  </div>

  <p class="mt-10 max-w-[640px] text-[13px] leading-relaxed text-neutral-400">
    Rankings come from independent public sources and our own use. Pricing is re-checked by hand and
    dated on every product page. We take no payment for placement.
  </p>

 </article>
 <div class="h-14"></div>
</div>`;
</script>
</body>
</html>
