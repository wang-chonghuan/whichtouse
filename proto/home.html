<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhichToUse — pick by the job, not by the tool</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

/* Home shows the top three of each standing — enough to answer "what would I
 * pick" without reproducing the task page. Detail is a click away, never here. */
const previewRow = (it, i) => `
  <a href="category.html" class="group flex items-start gap-2 border-b border-neutral-100 py-2 last:border-0">
    <span class="w-3.5 pt-[3px] text-center text-[11.5px] tabular-nums text-neutral-400">${i + 1}</span>
    <span class="min-w-0 flex-1">
      <span class="block truncate text-[13px] font-semibold group-hover:text-blue-700">${it.n}</span>
      <span class="mt-0.5 block text-[11.5px] leading-[1.4] text-neutral-500">${it.verdict}</span>
    </span>
  </a>`;

const previewStanding = (track, list) => {
  const isChallenger = list.key === 'challengers';
  return `
    <div class="mt-4 first:mt-0">
      <div class="mb-0.5 flex items-baseline gap-2 border-b pb-1 ${isChallenger ? 'border-blue-200' : 'border-neutral-200'}">
        <span class="text-[10.5px] font-bold tracking-[0.05em] ${isChallenger ? 'text-blue-700' : 'text-neutral-700'}">${list.label.toUpperCase()}</span>
        <span class="ml-auto text-[10px] text-neutral-400">${TASK[track.key][list.key].length}</span>
      </div>
      ${TASK[track.key][list.key].slice(0, 3).map(previewRow).join('')}
    </div>`;
};

const previewCol = (track) => `
  <section class="min-w-0">
    <div class="flex items-center gap-2 pb-2">
      <span class="h-2 w-2 rounded-full" style="background:${track.dot}"></span>
      <span class="text-[13.5px] font-bold">${track.label}</span>
    </div>
    ${LISTS.map((list) => previewStanding(track, list)).join('')}
  </section>`;

main.innerHTML = `
<div class="mx-auto max-w-[1180px] px-6 py-6">

  <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
    <h1 class="text-[24px] font-extrabold tracking-tight">${TASK.name}</h1>
    <span class="text-[12.5px] text-neutral-400">default task · pick another on the left</span>
  </div>
  <p class="mt-2 max-w-[720px] text-[13.5px] leading-relaxed text-neutral-600">${TASK.note}</p>
  <p class="mt-1.5 max-w-[720px] text-[12.5px] text-neutral-400">
    Each form carries two standings — what has held the top, and what is coming for it.
  </p>

  <div class="mt-6 grid gap-x-8 gap-y-7 md:grid-cols-2 xl:grid-cols-3">
    ${TRACKS.map(previewCol).join('')}
  </div>

  <a href="category.html" class="mt-7 inline-flex items-center gap-1.5 rounded-full border border-neutral-200 px-4 py-2 text-[13px] font-semibold transition hover:border-blue-400 hover:text-blue-700">
    Open full ${TASK.name} ranking <span>→</span>
  </a>

  <p class="mt-8 max-w-[720px] text-[12px] leading-relaxed text-neutral-400">
    Tracking GitHub, Hacker News, Product Hunt and the MCP registry daily —
    ${TASK.inReview} in review. Nothing appears above until we have opened it.
  </p>

  <div class="h-14"></div>
</div>`;
</script>
</body>
</html>
