<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Style A · P1 — Swiss × MD3 · violet + amber</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- MD3 colour roles. Page surface is pure white; the tonal containers do
         the work MD3 normally gives to a tinted surface. ---- */
  :root {
    --primary:            #6C3EF5;
    --on-primary:         #FFFFFF;
    --primary-container:  #EDE7FE;
    --on-primary-container:#2A0D80;

    --secondary:          #FFB300;
    --on-secondary:       #1A1200;
    --secondary-container:#FFF3D6;
    --on-secondary-container:#4A3200;

    --surface:            #FFFFFF;
    --surface-container:  #F6F4FE;   /* primary at ~4% */
    --on-surface:         #121212;   /* 17:1 on white */
    --on-surface-variant: #4A4A4A;   /*  9:1 on white */
    --outline:            #737373;
    --outline-variant:    #E2E0EA;

    --good: #007A3D;
    --bad:  #C4003C;

    /* MD3 shape scale */
    --r-xs: 4px; --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 28px;
  }
  body { font-family: Outfit, system-ui, sans-serif; color: var(--on-surface); background: var(--surface); }
  /* MD3 type scale, the four sizes this screen actually needs */
  .t-headline { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
  .t-title    { font-size: 16px; line-height: 1.3;  font-weight: 700; }
  .t-body     { font-size: 13.5px; line-height: 1.45; }
  .t-label    { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  /* Swiss: rules carry the structure, not boxes */
  .rule { border-color: var(--outline-variant); }
</style>
</head>
<body class="flex h-screen flex-col overflow-hidden">
<script src="shared.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', `
  <header class="flex h-[64px] flex-shrink-0 items-center gap-6 border-b px-6 rule">
    <span class="text-[20px] font-extrabold tracking-tight">Which<span style="color:var(--primary)">ToUse</span></span>
    <span class="hidden text-[12.5px] md:block" style="color:var(--on-surface-variant)">Pick by the job, not by the tool</span>
    <button class="ml-auto flex h-[40px] w-full max-w-[360px] items-center gap-2.5 px-4 text-left text-[13px]"
            style="border-radius:var(--r-xl);background:var(--surface-container);color:var(--on-surface-variant)">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </button>
  </header>
  <div class="flex min-h-0 flex-1">
    <aside class="hidden w-[248px] flex-shrink-0 overflow-y-auto border-r py-4 rule lg:block">
      <div class="px-6 pb-3 t-label" style="color:var(--on-surface-variant)">Tasks</div>
      <nav id="nav" class="flex flex-col gap-1 px-3"></nav>
    </aside>
    <main id="main" class="min-w-0 flex-1 overflow-y-auto"></main>
  </div>
`);

/* MD3 navigation-drawer item: 56px, fully rounded, active uses secondary-container */
document.getElementById('nav').innerHTML = TASKS.map(([slug, name], i) => `
  <a href="#" class="flex h-[46px] items-center px-5 text-[13.5px] transition"
     style="border-radius:var(--r-xl);${i === 0
       ? 'background:var(--primary-container);color:var(--on-primary-container);font-weight:700'
       : 'color:var(--on-surface-variant)'}">${name}</a>`).join('');

const card = (it, i) => `
  <a href="#" class="group block border-b py-3.5 last:border-0 rule">
    <div class="flex items-baseline gap-3">
      <span class="w-5 flex-shrink-0 text-[12px] tabular-nums" style="color:var(--outline)">${i + 1}</span>
      <div class="min-w-0 flex-1">
        <div class="t-title group-hover:underline" style="text-decoration-color:var(--primary)">${it.owner ? it.owner + '/' : ''}${it.n}</div>
        <p class="mt-1 t-body" style="color:var(--on-surface-variant)">${it.desc}</p>
        <p class="mt-1.5 flex items-start gap-2 t-body">
          <span class="mt-[6px] h-1.5 w-1.5 flex-shrink-0 rounded-full" style="background:var(--good)"></span>${it.edge}
        </p>
        <p class="mt-1 flex items-start gap-2 t-body">
          <span class="mt-[6px] h-1.5 w-1.5 flex-shrink-0 rounded-full" style="background:var(--bad)"></span>${it.con}
        </p>
      </div>
    </div>
  </a>`;

const standing = (track, list) => {
  const all = TASK[track.key][list.key];
  const rest = all.slice(5, 10);
  const isEmerging = list.key === 'emerging';
  return `
  <section class="mt-7 first:mt-0">
    <div class="mb-1 flex items-baseline gap-2 border-b-2 pb-2"
         style="border-color:${isEmerging ? 'var(--secondary)' : 'var(--on-surface)'}">
      <span class="t-label" style="color:${isEmerging ? 'var(--on-secondary-container)' : 'var(--on-surface)'}">${list.label}</span>
      <span class="text-[11px]" style="color:var(--on-surface-variant)">${list.note}</span>
      <span class="ml-auto text-[11px] font-bold tabular-nums" style="color:var(--outline)">${all.length}</span>
    </div>
    ${all.slice(0, 5).map((it, i) => card(it, i)).join('')}
    ${rest.length ? `
      <button class="mt-3 h-[36px] w-full text-[12.5px] font-bold transition"
              style="border-radius:var(--r-xl);background:var(--primary-container);color:var(--on-primary-container)">
        Show ${rest.length} more
      </button>` : `
      <p class="mt-3 text-center text-[11.5px]" style="color:var(--outline)">Only ${all.length} clear the bar here.</p>`}
  </section>`;
};

document.getElementById('main').innerHTML = `
<div class="mx-auto max-w-[1240px] px-8 py-9">

  <h1 class="t-headline">${TASK.name}</h1>
  <p class="mt-3 max-w-[680px] t-body" style="color:var(--on-surface-variant)">${TASK.note}</p>

  <div class="mt-9 grid gap-x-8 gap-y-10 md:grid-cols-2 xl:grid-cols-3">
    ${TRACKS.map((track, i) => `
      <div class="min-w-0 ${i ? 'xl:border-l xl:pl-8 rule' : ''}">
        <div class="flex items-center gap-2 border-b-[3px] pb-2" style="border-color:var(--primary)">
          <h2 class="t-title">${track.label}</h2>
        </div>
        ${LISTS.map((list) => standing(track, list)).join('')}
      </div>`).join('')}
  </div>

  <section class="mt-14 border-t pt-6 rule">
    <div class="flex items-baseline gap-3">
      <h2 class="t-label">Watchlist</h2>
      <span class="text-[12px]" style="color:var(--on-surface-variant)">pulled or being re-checked</span>
    </div>
    <div class="mt-3 flex flex-wrap gap-2">
      ${TASK.watchlist.map((w) => `
        <span class="px-3 py-1 text-[12.5px]" style="border-radius:var(--r-s);background:var(--surface-container);color:var(--on-surface-variant)">${w.n}</span>`).join('')}
    </div>
  </section>

  <div class="h-16"></div>
</div>`;
</script>
</body>
</html>
