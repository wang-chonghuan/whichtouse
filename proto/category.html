<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Writing — which tool to use — WhichToUse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

/* The whole card is the link to the detail page — the card itself never expands,
 * so the domain is shown as text rather than a second, competing link. */
const card = (it, i) => `
  <a href="product.html" class="group block border-b border-neutral-100 py-3.5 last:border-0">
    <div class="flex items-start gap-2.5">
      <span class="w-4 pt-1 text-center text-[12px] tabular-nums text-neutral-400">${i + 1}</span>
      <span class="mt-0.5 flex h-6 w-6 flex-shrink-0 items-center justify-center rounded-md text-[11px] font-bold text-white" style="background:${mono(it.n, i)}">${it.n[0]}</span>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <span class="text-[14px] font-semibold group-hover:text-blue-700">${it.n}</span>
          <span class="text-[11px] text-neutral-400">${it.url}</span>
        </div>

        <p class="mt-1 text-[13px] font-medium leading-snug">${it.verdict}</p>

        <p class="mt-1.5 text-[12.5px] leading-snug text-neutral-500">
          <span class="text-neutral-400">Good for</span> ${it.who}
        </p>

        <div class="mt-2 grid gap-1 text-[12.5px] leading-snug sm:grid-cols-2">
          <div class="flex gap-1.5"><span class="text-emerald-600">✓</span><span>${it.pro}</span></div>
          <div class="flex gap-1.5"><span class="text-rose-500">✗</span><span class="text-rose-700/90">${it.con}</span></div>
        </div>

        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11.5px] text-neutral-400">
          <span class="font-medium text-neutral-600">${it.price}</span>
          <span class="text-neutral-300">·</span>
          <span>checked ${it.checked}</span>
        </div>
      </div>
    </div>
  </a>`;

/* One standing: five by default, the rest revealed in place. */
const standing = (track, list) => {
  const all = TASK[track.key][list.key];
  const top = all.slice(0, 5);
  const rest = all.slice(5, 10);
  const isChallenger = list.key === 'challengers';
  return `
  <section class="mt-6 first:mt-0">
    <div class="mb-1 flex flex-wrap items-baseline gap-x-2 gap-y-0.5 border-b-2 pb-2 ${isChallenger ? 'border-blue-200' : 'border-neutral-200'}">
      <span class="text-[11.5px] font-bold tracking-[0.05em] ${isChallenger ? 'text-blue-700' : ''}">${list.label.toUpperCase()}</span>
      <span class="text-[11px] text-neutral-400">${list.note}</span>
      <span class="ml-auto text-[10.5px] font-semibold text-neutral-400">${all.length}</span>
    </div>
    ${top.map((it, i) => card(it, i)).join('')}
    ${rest.length ? `
      <div data-more class="hidden border-t border-neutral-100">${rest.map((it, i) => card(it, i + 5)).join('')}</div>
      <button data-expand data-count="${rest.length}" class="mt-2.5 w-full rounded-lg border border-neutral-200 py-1.5 text-[12px] font-semibold text-neutral-500 transition hover:border-blue-300 hover:text-blue-700">
        Show ${rest.length} more
      </button>` : `
      <p class="mt-2.5 text-center text-[11.5px] text-neutral-400">Only ${all.length} clear the bar here.</p>`}
  </section>`;
};

const column = (track) => `
  <div class="min-w-0">
    <div class="flex items-center gap-2 pb-3">
      <span class="h-2.5 w-2.5 rounded-full" style="background:${track.dot}"></span>
      <h2 class="text-[15px] font-bold tracking-tight">${track.label}</h2>
    </div>
    ${LISTS.map((list) => standing(track, list)).join('')}
  </div>`;

main.innerHTML = `
<div class="mx-auto max-w-[1180px] px-6 py-6">

  <nav class="text-[12.5px] text-neutral-400"><a href="home.html" class="hover:text-blue-600">Home</a><span class="px-1">›</span>${TASK.name}</nav>

  <h1 class="mt-1.5 text-[26px] font-extrabold tracking-tight">${TASK.name}</h1>
  <p class="mt-2 max-w-[740px] text-[13.5px] leading-relaxed text-neutral-600">${TASK.note}</p>
  <p class="mt-2 max-w-[740px] text-[12.5px] text-neutral-400">
    Three forms, ranked separately — a hosted product, a repo you run, and a skill you drop into an
    agent are not the same decision. Each form has two standings: what has held the top, and what is
    coming for it.
  </p>

  <div class="mt-7 grid gap-x-8 gap-y-10 md:grid-cols-2 xl:grid-cols-3">
    ${TRACKS.map(column).join('')}
  </div>

  <!-- what we removed or are still holding -->
  <section class="mt-6">
    <button id="archiveBtn" class="flex w-full items-center gap-2 rounded-xl border border-neutral-200 px-4 py-3 text-left transition hover:bg-neutral-50">
      <span class="text-[13.5px] font-semibold">Previously listed &amp; watchlist</span>
      <span class="rounded-full bg-neutral-100 px-2 py-0.5 text-[11px] font-semibold text-neutral-500">${TASK.archive.length}</span>
      <span class="ml-auto text-[12px] text-neutral-400">what we removed, and why</span>
      <span id="archiveChev" class="text-neutral-400 transition">▾</span>
    </button>
    <div id="archive" class="hidden overflow-hidden rounded-b-xl border border-t-0 border-neutral-200">
      <table class="w-full text-sm">
        <tbody>
          ${TASK.archive.map((a, i) => `
            <tr class="${i ? 'border-t border-neutral-100' : ''}">
              <td class="px-4 py-2.5 text-[13px] font-medium">${a.n}</td>
              <td class="w-[110px] px-4 py-2.5"><span class="rounded-full px-1.5 py-px text-[10.5px] font-semibold ring-1 ${STATUS[a.status][1]}">${STATUS[a.status][0]}</span></td>
              <td class="px-4 py-2.5 text-[12.5px] text-neutral-500">${a.why}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </section>

  <p class="mt-8 text-[12px] leading-relaxed text-neutral-400">
    Five per standing by default, ten at most. Removing an entry is as much of the job as adding one.
    Tracking GitHub, Hacker News, Product Hunt and the MCP registry daily — ${TASK.inReview} in review,
    listed here only once we have opened them.
  </p>

  <div class="h-14"></div>
</div>`;

/* Expand in place: the list grows, the cards do not change. */
document.querySelectorAll('[data-expand]').forEach((btn) => {
  const count = btn.dataset.count;
  btn.addEventListener('click', () => {
    const open = !btn.previousElementSibling.classList.toggle('hidden');
    btn.textContent = open ? 'Show top 5 only' : `Show ${count} more`;
  });
});

const archiveBtn = document.getElementById('archiveBtn');
archiveBtn.addEventListener('click', () => {
  const open = !document.getElementById('archive').classList.toggle('hidden');
  document.getElementById('archiveChev').style.transform = open ? 'rotate(180deg)' : '';
});
</script>
</body>
</html>
