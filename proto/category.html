<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Best Content Writing AI Tools & Skills, Ranked — WhichToUse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

const apps = [
  { n:'ChatGPT', c:'High', price:'Freemium', paid:'$20/mo', s:9.4, v:'Jul 23',
    good:'The strongest all-round first draft.', bad:'Loses the thread on long pieces.' },
  { n:'Claude', c:'High', price:'Freemium', paid:'$20/mo', s:9.1, v:'Jul 23',
    good:'Best at holding a voice across a long document.', bad:'Free tier throttles quickly.' },
  { n:'Jasper', c:'High', price:'Paid', paid:'from $49/mo', s:8.8, v:'Jul 20',
    good:'Built for brand voice and team workflows.', bad:'Expensive, and output reads templated.' },
  { n:'Writesonic', c:'Medium', price:'Freemium', paid:'from $16/mo', s:7.3, v:'Jul 20',
    good:'Cheap way to get bulk marketing copy.', bad:'Quality swings hard between runs.' },
  { n:'Grammarly', c:'Medium', price:'Freemium', paid:'$12/mo', s:7.0, v:'Jul 23',
    good:'Works inside almost every writing surface.', bad:'Flattens a deliberate voice.' },
  { n:'Copy.ai', c:'Medium', price:'Freemium', paid:'from $49/mo', s:6.7, v:'Jul 20',
    good:'Fast at short-form ad and email variants.', bad:'Little to offer beyond templates.' },
];

const skills = [
  { n:'Anthropic Document Skills', c:'High', price:'Free / OSS', paid:'—', s:9.4, v:'Jul 23',
    good:'Produces genuinely editable .docx and .pptx.', bad:'No GUI — you install and wire it yourself.' },
  { n:'Novel (steven-tey)', c:'High', price:'Free / OSS', paid:'—', s:9.1, v:'Jul 23',
    good:'The de-facto open AI editor.', bad:'An editor, not a writing agent.' },
  { n:'content-research-writer', c:'Medium', price:'Free / OSS', paid:'—', s:7.3, v:'Jul 18',
    good:'Research → outline → draft in one skill.', bad:'Adoption is inherited from its parent repo.' },
  { n:'Reor', c:'Medium', price:'Free / OSS', paid:'—', s:7.0, v:'Jul 18',
    good:'Local-first notes with retrieval built in.', bad:'Writing is adjacent, not the focus.' },
];

const row = (it, i) => `
  <a href="product.html" class="group grid grid-cols-[26px_28px_1fr_auto] items-start gap-3 border-b border-neutral-100 px-2 py-3.5 transition hover:bg-neutral-50/80">
    <span class="pt-1.5 text-center text-[13px] tabular-nums text-neutral-400">${i + 1}</span>
    <span class="mt-0.5 flex h-7 w-7 items-center justify-center rounded-lg text-[13px] font-bold text-white" style="background:${mono(it.n, i)}">${it.n[0]}</span>
    <span class="min-w-0">
      <span class="flex flex-wrap items-center gap-x-2 gap-y-1">
        <span class="text-[14.5px] font-semibold group-hover:text-blue-700">${it.n}</span>
        <span class="rounded-full px-1.5 py-px text-[10.5px] font-semibold ${CONF[it.c]}">${it.c}</span>
      </span>
      <span class="mt-1 block text-[12.5px] leading-[1.45] text-neutral-500">
        ${it.good}
        <span class="text-rose-600/90">${it.bad}</span>
      </span>
    </span>
    <span class="pt-0.5 text-right">
      <span class="block text-[15px] font-bold tabular-nums">${it.s.toFixed(1)}</span>
      <span class="mt-0.5 block whitespace-nowrap text-[11.5px] text-neutral-400">${it.paid === '—' ? it.price : it.paid}</span>
    </span>
  </a>`;

const track = (label, dot, list) => `
  <section class="min-w-0">
    <div class="mb-1 flex items-center gap-2 border-b-2 border-neutral-200 pb-2">
      <span class="h-2 w-2 rounded-full" style="background:${dot}"></span>
      <span class="text-[11.5px] font-bold tracking-[0.05em]">${label}</span>
      <span class="rounded-full bg-neutral-100 px-1.5 text-[11px] font-semibold text-neutral-500">${list.length}</span>
    </div>
    ${list.map(row).join('')}
  </section>`;

main.innerHTML = `
<div class="mx-auto max-w-[1140px] px-6 py-8">

  <nav class="text-[12.5px] text-neutral-400">
    <a href="home.html" class="hover:text-blue-600">Home</a>
    <span class="px-1">›</span>Content Writing
  </nav>

  <h1 class="mt-2 text-[30px] font-extrabold leading-[1.12] tracking-tight">Best Content Writing AI tools</h1>
  <p class="mt-3 max-w-[660px] text-[15px] leading-relaxed text-neutral-600">
    General-purpose models have absorbed most of this category. What is left for dedicated
    writing tools is brand voice and team workflow — and on the open-source side, the ecosystem
    is genuinely thin. Here is what we found after opening each one.
  </p>

  <!-- the safe pick vs the rising one -->
  <div class="mt-7 grid gap-4 md:grid-cols-2">
    <div class="rounded-2xl border border-neutral-200 p-5">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold uppercase tracking-[0.09em] text-neutral-500">Safe pick</span>
        <span class="text-[11px] text-neutral-300">·</span>
        <span class="text-[11px] text-neutral-400">12 months at the top</span>
      </div>
      <div class="mt-2.5 flex items-center gap-2.5">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#3b6fb0] text-[15px] font-bold text-white">C</span>
        <span class="text-[19px] font-bold">ChatGPT</span>
      </div>
      <p class="mt-2.5 text-[13.5px] leading-relaxed text-neutral-600">
        Has held the top of every serious round-up we track for a year. No surprises in price
        or capability — the choice you pick when you cannot afford to be wrong.
      </p>
    </div>

    <div class="relative overflow-hidden rounded-2xl border border-blue-200 bg-gradient-to-br from-blue-50/70 to-transparent p-5">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold uppercase tracking-[0.09em] text-blue-700">Rising</span>
        <span class="text-[11px] text-blue-300">·</span>
        <span class="text-[11px] text-blue-500">+38% in 90 days</span>
      </div>
      <div class="mt-2.5 flex items-center gap-2.5">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#2f9e6b] text-[15px] font-bold text-white">A</span>
        <span class="text-[19px] font-bold">Anthropic Document Skills</span>
      </div>
      <p class="mt-2.5 text-[13.5px] leading-relaxed text-neutral-600">
        Five months old and climbing fast. Unlike everything above it, what comes out is a real
        editable file rather than text you still have to format.
      </p>
    </div>
  </div>

  <!-- the two tracks -->
  <div class="mt-9 grid gap-x-10 gap-y-8 lg:grid-cols-2">
    ${track('APP / SAAS', '#4257c9', apps)}
    ${track('SKILL / REPO', '#7a49d6', skills)}
  </div>

  <!-- pricing, side by side -->
  <section class="mt-12">
    <h2 class="text-[19px] font-bold tracking-tight">What they actually cost</h2>
    <p class="mt-1.5 text-[13.5px] text-neutral-500">Entry paid tier, normalised. We re-check these by hand.</p>
    <div class="mt-4 overflow-x-auto rounded-2xl border border-neutral-200">
      <table class="w-full min-w-[640px] text-sm">
        <thead class="bg-neutral-50/80 text-left text-[11px] font-bold uppercase tracking-wide text-neutral-500">
          <tr>
            <th class="px-5 py-3">Tool</th>
            <th class="px-5 py-3 w-[140px]">Free tier</th>
            <th class="px-5 py-3 w-[150px]">Entry paid</th>
            <th class="px-5 py-3 w-[120px]">Verified</th>
          </tr>
        </thead>
        <tbody>
          ${[...apps, ...skills].map((it, i) => `
            <tr class="${i ? 'border-t border-neutral-100' : ''}">
              <td class="px-5 py-3 font-semibold">${it.n}</td>
              <td class="px-5 py-3 text-neutral-600">${it.price === 'Paid' ? '<span class="text-neutral-400">None</span>' : it.price}</td>
              <td class="px-5 py-3 font-medium tabular-nums">${it.paid}</td>
              <td class="px-5 py-3 text-[12.5px] text-neutral-400">${it.v}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </section>

  <!-- curated new arrivals -->
  <section class="mt-12">
    <h2 class="text-[19px] font-bold tracking-tight">New in this category</h2>
    <p class="mt-1.5 text-[13.5px] text-neutral-500">Only things we have opened. One line on whether it is worth your time.</p>
    <div class="mt-4 grid gap-3 md:grid-cols-2">
      ${[
        ['Automattic/harper', 'Offline, Rust-powered grammar checker', 'Worth a look if privacy rules out Grammarly. It checks; it does not write.'],
        ['ComposioHQ/awesome-claude-skills', 'Curated skill collection', 'Useful as an index — do not mistake it for a tool.'],
      ].map(([n, d, verdict]) => `
        <a href="product.html" class="group rounded-2xl border border-neutral-200 p-4 transition hover:border-blue-300 hover:bg-blue-50/20">
          <div class="text-[14.5px] font-semibold group-hover:text-blue-700">${n}</div>
          <div class="mt-0.5 text-[12.5px] text-neutral-400">${d}</div>
          <div class="mt-2 text-[13px] leading-relaxed text-neutral-600">${verdict}</div>
        </a>`).join('')}
    </div>
  </section>

  <div class="h-20"></div>
</div>`;
</script>
</body>
</html>
