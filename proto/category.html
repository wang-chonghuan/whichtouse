<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Writing — which tool to use — WhichToUse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,system-ui,sans-serif}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-[#171a21]">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

/* One entry carries: name, link, form, verdict, who it suits, one strength,
 * one catch, a price signal, and when we last checked it. */
const card = (it, i, track) => `
  <article class="border-b border-neutral-100 py-3.5 last:border-0">
    <div class="flex items-start gap-2.5">
      <span class="w-4 pt-1 text-center text-[12px] tabular-nums text-neutral-400">${i + 1}</span>
      <span class="mt-0.5 flex h-6 w-6 flex-shrink-0 items-center justify-center rounded-md text-[11px] font-bold text-white" style="background:${mono(it.n, i)}">${it.n[0]}</span>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <a href="https://${it.url}" target="_blank" rel="noreferrer"
             class="text-[14px] font-semibold hover:text-blue-700">${it.n}</a>
          <span class="text-[11px] text-neutral-400">${it.url}&nbsp;↗</span>
        </div>

        <p class="mt-1 text-[13px] font-medium leading-snug">${it.verdict}</p>

        <p class="mt-1.5 text-[12.5px] leading-snug text-neutral-500">
          <span class="text-neutral-400">Good for</span> ${it.who}
        </p>

        <div class="mt-2 grid gap-1 text-[12.5px] leading-snug sm:grid-cols-2">
          <div class="flex gap-1.5"><span class="text-emerald-600">✓</span><span>${it.pro}</span></div>
          <div class="flex gap-1.5"><span class="text-rose-500">✗</span><span class="text-rose-700/90">${it.con}</span></div>
        </div>

        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11.5px] text-neutral-400">
          <span class="font-medium text-neutral-600">${it.price}</span>
          <span class="text-neutral-300">·</span>
          <span>checked ${it.checked}</span>
        </div>
      </div>
    </div>
  </article>`;

const column = (track) => {
  const top = TASK[track.key];
  const rest = TASK.more[track.key] || [];
  return `
  <section class="min-w-0" data-track="${track.key}">
    <div class="mb-1 flex items-center gap-2 border-b-2 border-neutral-200 pb-2">
      <span class="h-2 w-2 rounded-full" style="background:${track.dot}"></span>
      <span class="text-[11.5px] font-bold tracking-[0.05em]">${track.label.toUpperCase()}</span>
      <span class="ml-auto text-[10.5px] font-semibold text-neutral-400">TOP 5</span>
    </div>
    ${top.map((it, i) => card(it, i, track)).join('')}
    <div data-more class="hidden">
      ${rest.map((it, i) => card(it, i + 5, track)).join('')}
    </div>
    ${rest.length ? `
      <button data-viewall class="mt-3 w-full rounded-lg border border-neutral-200 py-2 text-[12.5px] font-semibold text-neutral-600 transition hover:border-blue-300 hover:text-blue-700">
        View all (${top.length + rest.length})
      </button>` : `
      <p class="mt-3 text-center text-[12px] text-neutral-400">Only ${top.length} clear the bar here.</p>`}
  </section>`;
};

main.innerHTML = `
<div class="mx-auto max-w-[1180px] px-6 py-6">

  <nav class="text-[12.5px] text-neutral-400"><a href="home.html" class="hover:text-blue-600">Home</a><span class="px-1">›</span>${TASK.name}</nav>

  <h1 class="mt-1.5 text-[26px] font-extrabold tracking-tight">${TASK.name}</h1>
  <p class="mt-2 max-w-[740px] text-[13.5px] leading-relaxed text-neutral-600">${TASK.note}</p>
  <p class="mt-2 text-[12.5px] text-neutral-400">
    Three forms, ranked separately — a hosted product, a repo you run, and a skill you drop into an agent are not the same decision.
  </p>

  <div class="mt-7 grid gap-x-8 gap-y-9 md:grid-cols-2 xl:grid-cols-3">
    ${TRACKS.map(column).join('')}
  </div>

  <!-- radar for this task -->
  <section class="mt-11 rounded-2xl border border-neutral-200 bg-neutral-50/50 p-5">
    <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
      <h2 class="text-[15px] font-bold tracking-tight">Emerging radar</h2>
      <span class="text-[12px] text-neutral-500">found daily · judged later · nothing here is a recommendation yet</span>
    </div>
    <div class="mt-3 grid gap-2 sm:grid-cols-2">
      ${TASK.radar.map((r) => `
        <div class="flex items-start gap-2.5 rounded-lg bg-white px-3.5 py-2.5 ring-1 ring-neutral-200">
          <span class="min-w-0 flex-1">
            <span class="flex flex-wrap items-center gap-2">
              <a href="#" class="truncate text-[13px] font-semibold hover:text-blue-700">${r.n}</a>
              <span class="rounded-full px-1.5 py-px text-[10px] font-semibold ring-1 ${STATUS[r.status][1]}">${STATUS[r.status][0]}</span>
            </span>
            <span class="mt-0.5 block text-[12px] text-neutral-500">${r.note}</span>
          </span>
          <span class="whitespace-nowrap pt-0.5 text-right text-[11px] text-neutral-400">${r.src}<br>${r.found}</span>
        </div>`).join('')}
    </div>
  </section>

  <!-- what we removed or are still holding: names and status only -->
  <section class="mt-6">
    <button id="archiveBtn" class="flex w-full items-center gap-2 rounded-xl border border-neutral-200 px-4 py-3 text-left transition hover:bg-neutral-50">
      <span class="text-[13.5px] font-semibold">Previously listed &amp; watchlist</span>
      <span class="rounded-full bg-neutral-100 px-2 py-0.5 text-[11px] font-semibold text-neutral-500">${TASK.archive.length}</span>
      <span class="ml-auto text-[12px] text-neutral-400">what we removed, and why</span>
      <span id="archiveChev" class="text-neutral-400 transition">▾</span>
    </button>
    <div id="archive" class="hidden overflow-hidden rounded-b-xl border border-t-0 border-neutral-200">
      <table class="w-full text-sm">
        <tbody>
          ${TASK.archive.map((a, i) => `
            <tr class="${i ? 'border-t border-neutral-100' : ''}">
              <td class="px-4 py-2.5"><a href="${a.url}" class="text-[13px] font-medium hover:text-blue-700">${a.n}</a></td>
              <td class="px-4 py-2.5 w-[110px]"><span class="rounded-full px-1.5 py-px text-[10.5px] font-semibold ring-1 ${STATUS[a.status][1]}">${STATUS[a.status][0]}</span></td>
              <td class="px-4 py-2.5 text-[12.5px] text-neutral-500">${a.why}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </section>

  <p class="mt-8 text-[12px] leading-relaxed text-neutral-400">
    Five per form by default, ten at most. Removing an entry is as much of the job as adding one.
  </p>

  <div class="h-14"></div>
</div>`;

/* View all: 5 -> up to 10, per column */
document.querySelectorAll('[data-viewall]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const more = btn.parentElement.querySelector('[data-more]');
    const open = !more.classList.toggle('hidden');
    btn.textContent = open ? 'Show top 5 only' : `View all (${more.children.length + 5})`;
  });
});

const archiveBtn = document.getElementById('archiveBtn');
archiveBtn.addEventListener('click', () => {
  const open = !document.getElementById('archive').classList.toggle('hidden');
  document.getElementById('archiveChev').style.transform = open ? 'rotate(180deg)' : '';
});
</script>
</body>
</html>
