<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatGPT — Content Writing — WhichToUse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>html{scroll-behavior:smooth}</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-background font-sans text-foreground">
<script src="shared.js"></script>
<script>
const main = shell({ active: 'content-writing' });

/* Everything the list deliberately withheld. The list decided what to open;
 * this is where the evidence lives. */
const P = {
  track: 'App / SaaS',
  owner: '',
  n: 'ChatGPT',
  rank: 1,
  standing: 'Leading',
  plan: 'Freemium',
  site: 'openai.com',
  desc: 'OpenAI’s general assistant, used here as a drafting tool. It is the default first draft for most people writing anything longer than a paragraph — a blank page in, a usable draft out, with no setup and no per-tool learning curve.',
  rankBasis: 'Every round-up we cite puts it at or near the top for raw generation, and the Reddit consensus in writing communities matches. Nothing else in this task turns a blank page into a usable draft as reliably, which is what this ranking is ordered by. Its ceiling — voice drift over long documents — costs it nothing here because the tools below it have the same problem or worse.',
  pricingFree: 'Full chat access on the current model, with usage limits that reset over a few hours',
  pricingPaid: 'Plus at $20/mo — higher limits, priority access during peak, and the newest models first',
  checked: 'Jul 23, 2026',
  features: ['Long-form drafting', 'Outline → draft in one thread', 'File and image input', 'Custom instructions for voice', 'Browsing for current facts'],
  pros: [
    'Strongest raw generation from a blank page',
    'One tool covers most writing jobs, so nothing else to learn',
    'Free tier is genuinely usable, not a demo',
    'Custom instructions hold a rough voice across sessions',
  ],
  cons: [
    'Drifts off-voice past a few thousand words',
    'Confidently invents specifics unless you make it cite',
    'No real brand-voice or team controls',
    'Output has a recognisable register that editors notice',
  ],
  sources: [
    'Reddit r/writing consensus threads',
    '2026 writing-tool round-ups',
    'Vendor pricing page',
  ],
  others: [
    { n:'Claude', s:'Holds one voice across a whole document' },
    { n:'Jasper', s:'Real brand-voice and team controls' },
    { n:'Grammarly', s:'Works inside almost every writing surface' },
    { n:'Notion AI', s:'No context-switching if you already live there' },
  ],
};

/* §3.8 — section headings on a detail page carry the 2px brand bar. It is the
 * only structural use of the brand colour in long-form content. */
const H2 = (t) => `<h2 class="mb-3.5 border-l-2 border-brand pl-3.5 text-xl font-bold tracking-tight md:text-[22px]">${t}</h2>`;

/* §3.2 — the dot pair, using the two §5 extension tokens. */
const bullet = (x, kind) => `
  <li class="flex items-start gap-2 text-[13.5px] leading-normal">
    <span class="mt-[7px] size-1.5 shrink-0 rounded-full bg-${kind}"></span><span>${x}</span>
  </li>`;

const fact = (k, v) => `
  <div class="flex items-baseline justify-between gap-4 border-b border-border/70 py-2.5 last:border-0">
    <span class="text-[13.5px] text-muted-foreground">${k}</span>
    <span class="text-right text-sm font-semibold">${v}</span>
  </div>`;

main.innerHTML = `
<div class="mx-auto mb-16 mt-7 flex max-w-container flex-col gap-7 px-4 sm:px-6 lg:px-8">

  <!-- §3.9 breadcrumb -->
  <nav class="flex flex-wrap items-center gap-3 text-sm text-muted-foreground">
    <a href="category.html" aria-label="Back to ${TASK.name}"
       class="flex size-9 shrink-0 items-center justify-center rounded-full border border-border bg-card transition-colors hover:border-foreground/20">
      <svg class="size-4 text-foreground" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m0 0 7 7m-7-7 7-7"/></svg>
    </a>
    <a href="home.html" class="transition-colors hover:text-foreground">Home</a>
    <span>&rsaquo;</span>
    <a href="category.html" class="transition-colors hover:text-foreground">${TASK.name}</a>
    <span>&rsaquo;</span>
    <span class="font-semibold text-foreground">${P.n}</span>
  </nav>

  <!-- §3.9 — content spans 2 of 3, sidebar takes the last column -->
  <div class="grid grid-cols-1 gap-8 lg:grid-cols-3">

    <div class="flex flex-col gap-8 lg:col-span-2">

      <!-- §3.3 detail hero card -->
      <section class="rounded-2xl border border-border bg-card p-5 sm:p-6">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-start">
          <div class="flex min-w-0 flex-1 items-start gap-4">
            ${tile(P.n, 50)}
            <div class="min-w-0">
              <h1 class="truncate text-3xl font-bold leading-tight tracking-tight sm:text-[34px]">${P.owner ? P.owner + '/' : ''}${P.n}</h1>
              <div class="mt-2.5 flex flex-wrap items-center gap-2">
                <!-- §3.2 dark metric badge: black fill, brand text -->
                <span class="rounded-full bg-primary px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-micro text-brand">${P.standing} · #${P.rank}</span>
                <span class="rounded-full bg-secondary px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-micro text-secondary-foreground">${P.track}</span>
                <span class="rounded-full bg-accent px-2 py-0.5 text-[9.5px] font-bold uppercase tracking-micro text-accent-foreground">${P.plan}</span>
              </div>
            </div>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <button class="inline-flex h-[42px] cursor-pointer items-center gap-1.5 rounded-xl border border-input bg-card px-4 text-sm font-semibold transition-colors hover:border-foreground/20">
              Copy link
            </button>
            <a href="https://${P.site}" target="_blank" rel="noreferrer"
               class="inline-flex h-[42px] items-center gap-1.5 rounded-xl bg-primary px-5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/88">
              Visit
              <svg class="size-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
            </a>
          </div>
        </div>
        <p class="mt-5 text-[15.5px] leading-normal text-muted-foreground">${P.desc}</p>
      </section>

      <section>
        ${H2(`Why it ranks #${P.rank}`)}
        <p class="text-[14.5px] leading-relaxed">${P.rankBasis}</p>
      </section>

      <section>
        ${H2('Strengths and limitations')}
        <div class="grid gap-x-8 gap-y-3 sm:grid-cols-2">
          <ul class="space-y-2">${P.pros.map((x) => bullet(x, 'edge')).join('')}</ul>
          <ul class="space-y-2">${P.cons.map((x) => bullet(x, 'con')).join('')}</ul>
        </div>
        <p class="mt-4 text-[12.5px] text-muted-foreground">From our own use plus aggregated reviews and community reports.</p>
      </section>

      <section>
        ${H2('Pricing')}
        <div class="overflow-hidden rounded-xl bg-secondary">
          <div class="flex gap-4 border-b border-border px-4 py-3">
            <span class="w-[88px] shrink-0 text-[12.5px] text-muted-foreground">Free plan</span>
            <span class="text-[13.5px]">${P.pricingFree}</span>
          </div>
          <div class="flex gap-4 px-4 py-3">
            <span class="w-[88px] shrink-0 text-[12.5px] text-muted-foreground">Entry paid</span>
            <span class="text-[13.5px]">${P.pricingPaid}</span>
          </div>
        </div>
        <p class="mt-2.5 text-[12.5px] text-muted-foreground">Verified by hand on ${P.checked}. Prices in this category change often — if this looks wrong, it probably is, and we want to know.</p>
      </section>

      <section>
        ${H2('Key features')}
        <div class="flex flex-wrap gap-2">
          ${P.features.map((f) => `<span class="rounded-full bg-secondary px-3 py-1 text-[13.5px] font-medium text-secondary-foreground">${f}</span>`).join('')}
        </div>
      </section>

      <section>
        ${H2(`Sources (${P.sources.length})`)}
        <div>
          ${P.sources.map((s) => `
            <a href="#" class="group flex items-center gap-2.5 border-b border-border/70 px-0.5 py-2.5 text-sm transition-[padding] hover:pl-2.5">
              <span class="min-w-0 flex-1 truncate">${s}</span>
              <svg class="size-4 shrink-0 text-muted-foreground" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
            </a>`).join('')}
        </div>
      </section>

    </div>

    <!-- §3.9 sidebar stack -->
    <aside class="flex flex-col gap-5">

      <section class="rounded-2xl border border-border bg-card p-5">
        <h2 class="mb-2 text-base font-semibold">Quick facts</h2>
        ${fact('Form', P.track)}
        ${fact('Standing', `${P.standing} · #${P.rank}`)}
        ${fact('Pricing model', P.plan)}
        ${fact('Entry paid tier', '$20 / mo')}
        ${fact('Last verified', P.checked)}
      </section>

      <section class="rounded-2xl border border-panel-tint-border bg-panel-tint p-5">
        <h2 class="mb-1 text-base font-semibold">Other ${P.track} options</h2>
        <p class="mb-2 text-[13.5px] text-muted-foreground">Same task, same form, ranked below this one.</p>
        ${P.others.map((o, i) => `
          <a href="product.html" class="group flex items-center gap-2.5 border-b border-border/70 px-0.5 py-2.5 transition-[padding] last:border-0 hover:pl-2.5">
            <span class="w-3 shrink-0 text-[12px] tabular-nums text-muted-foreground">${i + 2}</span>
            ${tile(o.n)}
            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-semibold">${o.n}</span>
              <span class="mt-0.5 block truncate text-[12.5px] text-muted-foreground">${o.s}</span>
            </span>
          </a>`).join('')}
      </section>

      <!-- §3.9 action row -->
      <div class="grid grid-cols-2 gap-2">
        <button class="inline-flex h-[42px] cursor-pointer items-center justify-center gap-1.5 rounded-xl border border-input bg-card text-sm font-semibold transition-colors hover:border-foreground/20">Suggest an edit</button>
        <button class="inline-flex h-[42px] cursor-pointer items-center justify-center gap-1.5 rounded-xl border border-input bg-card text-sm font-semibold transition-colors hover:border-foreground/20">Report</button>
      </div>

    </aside>

  </div>
</div>`;
</script>
</body>
</html>
